function taskF(id,vid){form("Programar tarea o cita",[{k:"c",l:"Cliente",t:"s",o:copts(),r:1,w:1},{k:"tp",l:"Tipo",t:"s",o:TP},{k:"d",l:"Fecha",t:"date",r:1,d:iso(1)},{k:"hr",l:"Hora (opcional)",t:"time"},{k:"v",l:"Vehículo (opcional)",t:"s",o:vopts()},{k:"n",l:"Nota",w:1}],{c:id||"",v:vid||""},v=>{const c=g("c",v.c);db.t.push({id:uid(),...v,done:0});hist(c,`Programado: ${v.tp} para el ${v.d}${v.hr?" a las "+v.hr:""}`)})}
async function setSt(id,i){if(i==15)return lostF(id);if(i==12)return saleF(id);const c=g("c",id);hist(c,`Etapa: ${ST[c.st]} → ${ST[i]}`);c.st=i;await save();$("#mod").classList.contains("on")?ficha(id):go(view)}
function lostF(id){form("Marcar oportunidad perdida",[{k:"mot",l:"Motivo",t:"s",o:MOT},{k:"x",l:"Nota",w:1}],{},v=>{const c=g("c",id);hist(c,`Etapa: ${ST[c.st]} → ${ST[15]}. Motivo: ${v.mot}. ${v.x}`);c.st=15;c.mot=v.mot;db.t.filter(t=>t.c==id).forEach(t=>t.done=1)})}
function offFields(){return[{k:"c",l:"Cliente",t:"s",o:copts(),r:1,w:1},{k:"v",l:"Vehículo",t:"s",o:vopts(),r:1,w:1},{k:"imp",l:"Importe ofertado (€)",t:"number",r:1},{k:"est",l:"Estado",t:"s",o:OE},{k:"cam",l:"Coche entregado a cambio",w:1},{k:"n",l:"Notas de la negociación",t:"a",w:1}]}
function svO(v,d){const c=g("c",v.c);if(d.id)Object.assign(d,v);else db.o.push({id:uid(),...v,f:iso()});hist(c,`Oferta ${v.est.toLowerCase()}: ${vn(v.v)} por ${money(v.imp)}`);if(c.st<8)c.st=8}
const offF=id=>form("Crear oferta",offFields(),{c:id||""},svO),offE=id=>form("Editar oferta",offFields(),g("o",id),svO);
function saleFields(){return[{k:"c",l:"Cliente",t:"s",o:copts(),r:1,w:1},{k:"v",l:"Vehículo vendido",t:"s",o:vopts(),r:1,w:1},{k:"p",l:"Precio final (€)",t:"number",r:1},{k:"fv",l:"Fecha de venta",t:"date",r:1},{k:"fe",l:"Fecha de entrega",t:"date"},{k:"es",l:"Estado de la operación",t:"s",o:SE},{k:"n",l:"Observaciones",t:"a",w:1}]}
function svS(v,d){const c=g("c",v.c);if(d.id)Object.assign(d,v);else db.s.push({id:uid(),...v});const ve=g("v",v.v);if(ve)ve.estado="Vendido";window._post=()=>avisoInteres(v.v,v.c);c.st=v.es=="Entregada"?13:12;hist(c,`Venta registrada: ${vn(v.v)} por ${money(v.p)} (${v.es})`)}
const saleF=id=>form("Cerrar venta",saleFields(),{c:id||"",fv:iso(),es:"Cerrada",v:(db.i.find(x=>x.c==id)||{}).v||""},svS),saleE=id=>form("Editar venta",saleFields(),g("s",id),svS);
function ficha(id){const c=g("c",id),ts=db.t.filter(x=>x.c==id&&!x.done).sort(sk),ints=intsH(c),hl=x=>`<li><b>${x.d}</b> — ${x.k=="call"?esc(x.dir)+" · "+esc(x.r)+(x.x?": "+esc(x.x):"")+(x.v&&vn(x.v)?" · coche: "+esc(vn(x.v)):""):esc(x.x)}</li>`;
open_(`<h3>${esc(c.n)} ${c.arch?'<span class="tag a">Archivado</span>':""}</h3><p class="sub">${esc(c.t)} · ${esc(c.e||"sin correo")} · ${esc(c.idi||"")} · ${esc(c.o)} · entrada ${c.fe}</p><p>Busca: <b>${esc(c.car||"sin definir")}</b> · Presupuesto ${money(c.pres)} · Pago: ${esc(c.pago)} · Financiación: ${esc(c.fin)} · Entrega coche: ${esc(c.perm)}</p>${c.com?`<p>${esc(c.com)}</p>`:""}
<label class="sub">Etapa</label><select onchange="setSt('${id}',+this.value)">${ST.map((s,i)=>op([i,s],c.st)).join("")}</select>${c.mot?`<p><span class="tag r">Perdida: ${esc(c.mot)}</span></p>`:""}
<p><button class="btn s" onclick="callF('${id}')">Registrar llamada</button> <button class="btn s g" onclick="taskF('${id}')">Programar tarea o cita</button> <button class="btn s g" onclick="offF('${id}')">Crear oferta</button> <button class="btn s g" onclick="saleF('${id}')">Cerrar venta</button> <button class="btn s g" onclick="editC('${id}')">Editar</button> <button class="btn s g" onclick="arch('${id}')">${c.arch?"Reactivar":"Archivar"}</button></p>
<b>Vehículos de interés</b> <button class="btn s g" onclick="intF('${id}')">Añadir vehículo de interés</button>${ints}<b>Próximas acciones</b>${ts.map(t=>trow(t,"",1)).join("")||'<p class="sub">Sin próxima acción programada.</p>'}
<b>Ofertas y ventas</b>${[...db.o.filter(o=>o.c==id).map(o=>`<div class="row"><div>Oferta ${esc(o.est)}: ${esc(vn(o.v))}</div><div>${money(o.imp)}</div></div>`),...db.s.filter(s=>s.c==id).map(s=>`<div class="row"><div>Venta ${esc(s.es)}: ${esc(vn(s.v))}</div><div>${money(s.p)}</div></div>`)].join("")||'<p class="sub">Todavía no hay ofertas ni ventas.</p>'}
<p><b>Historial</b></p><ul class="hist">${[...c.h].reverse().map(hl).join("")}</ul><button class="btn g" onclick="close_()">Cerrar</button>`)}

lastGood=JSON.stringify(db);
try{fh=(await kv("get","dir"))||null;if(fh){ds=(await fh.queryPermission({mode:"readwrite"}))=="granted"?"ok":"perm";if(ds=="ok"){await sync();await recuperarFotos()}}}catch(e){ds="err";err="No se pudo acceder a la carpeta de datos: "+e.message}
lastGood=JSON.stringify(db);try{if(navigator.storage&&navigator.storage.persist){pers=await navigator.storage.persisted();if(!pers)pers=await navigator.storage.persist()}}catch(e){}go("panel")})();
